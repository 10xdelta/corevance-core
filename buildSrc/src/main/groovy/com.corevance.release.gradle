apply plugin: 'com.corevance.gradle'
apply from: "${rootDir}/buildSrc/src/main/groovy/com.corevance.dependencies.gradle"

corevance {
    config {
        username = "${findProperty('corevance.config.username')}"
        password = "${findProperty('corevance.config.password')}"

        doc {
            url = 'git@github.com:apache/corevance-site.git'
            directory = "${System.getProperty("java.io.tmpdir")}/corevance-site"
            branch = "asf-site"
        }
        git {
            dir = "${projectDir.absolutePath}/.git"
            sections = [
                [
                    section: "user",
                    name: "name",
                    value: "${findProperty('corevance.config.name')}",
                ],
                [
                    section: "user",
                    name: "email",
                    value: "${findProperty('corevance.config.email')}",
                ],
                [
                    section: "user",
                    name: "signingkey",
                    value: "${findProperty('corevance.config.gnupg.keyName')}",
                ],
                [
                    section: "commit",
                    name: "gpgsign",
                    value: "true",
                ],
            ]
        }
        template {
            templateDir = "${projectDir}/buildSrc/src/main/resources"
        }
        gpg {
            keyName = "${findProperty('corevance.config.gnupg.keyName')}"
            publicKeyring = "${findProperty('corevance.config.gnupg.publicKeyring')}"
            secretKeyring = "${findProperty('corevance.config.gnupg.secretKeyring')}"
            password = "${findProperty('corevance.config.gnupg.password')}"
        }
        smtp {
            host = 'smtp.gmail.com'
            username = "${findProperty('corevance.config.smtp.username')}"
            password = "${findProperty('corevance.config.smtp.password')}"
            tls = true
            ssl = true
        }
        subversion {
            username = "${findProperty('corevance.config.username')}"
            password = "${findProperty('corevance.config.password')}"
            revision = 'HEAD'
        }
        jira {
            url = 'https://issues.apache.org/jira/rest/api/2/'
            username = "${findProperty('corevance.config.username')}"
            password = "${findProperty('corevance.config.password')}"
        }
        confluence {
            url = 'https://cwiki.apache.org/confluence/rest/api/'
            username = "${findProperty('corevance.config.username')}"
            password = "${findProperty('corevance.config.password')}"
        }
    }

    steps = [
        test: [
            order: 0,
            description: 'Test',
            email: [
                from: "${findProperty('corevance.config.email')}",
                to: "${findProperty('corevance.config.email')}",
                mime: 'text/plain',
                subject: "[COREVANCE] [TEST] 📣 🏁 🗳️ 🚀 📈 🔀 🌠 Propose new release ${version}",
                messageTemplate: [
                    templateFile: "${projectDir}/buildSrc/src/main/resources/email/release.step01.headsup.message.ftl"
                ]
            ],
            subversion: [
                url: 'https://dist.apache.org/repos/dist/dev/corevance',
                directory: "${System.getProperty("java.io.tmpdir")}"
            ],
            jira: [
                query: "project in (\'COREVANCE\') and fixVersion = ${findProperty('corevance.release.version')} and status in (CLOSED, RESOLVED)"
            ],
            template: [
                templateFile: "${projectDir}/buildSrc/src/main/resources/jira/changelog.txt.ftl"
            ],
            gpg: [
                files: [
                    "${projectDir}/buildSrc/build/libs/buildSrc.jar"
                ]
            ]
        ],
        step1: [
            order: 1,
            description: 'Send heads-up email to dev mailing list',
            email: [
                from: "${findProperty('corevance.config.email')}",
                name: "${findProperty('corevance.config.name')}",
                to: "${findProperty('corevance.config.email')}",
                // to: 'dev@corevance.apache.org',
                mime: 'text/plain',
                subjectTemplate: [
                    templateFile: "${projectDir}/buildSrc/src/main/resources/email/release.step01.headsup.subject.ftl"
                ],
                messageTemplate: [
                    templateFile: "${projectDir}/buildSrc/src/main/resources/email/release.step01.headsup.message.ftl"
                ]
            ]
        ],
        step2: [
            order: 2,
            description: 'Clean up JIRA',
        ],
        step3: [
            order: 3,
            description: 'Create a release branch',
            email: [
                from: "${findProperty('corevance.config.email')}",
                name: "${findProperty('corevance.config.name')}",
                to: "${findProperty('corevance.config.email')}",
                // to: 'dev@corevance.apache.org',
                mime: 'text/plain',
                subjectTemplate: [
                    templateFile: "${projectDir}/buildSrc/src/main/resources/email/release.step03.branch.subject.ftl"
                ],
                messageTemplate: [
                    templateFile: "${projectDir}/buildSrc/src/main/resources/email/release.step03.branch.message.ftl"
                ]
            ]
        ],
        step4: [
            order: 4,
            description: 'Freeze JIRA version',
        ],
        step5: [
            order: 5,
            description: 'Create release tag',
            git: [
                messageTemplate: [
                    templateFile: "${projectDir}/buildSrc/src/main/resources/git/release.step05.tag.message.ftl"
                ]
            ]
        ],
        step6: [
            order: 6,
            description: 'Create a distribution',
        ],
        step7: [
            order: 7,
            description: 'Sign the distribution artifacts',
            gpg: [
                files: [
                    "${rootDir}/corevance-war/build/distributions/apache-corevance-src-${project.version}.tar.gz",
                    "${rootDir}/corevance-war/build/distributions/apache-corevance-bin-${project.version}.tar.gz"
                ]
            ]
        ],
        step8: [
            order: 8,
            description: 'Upload distribution artifacts to staging environment',
            subversion: [
                url: 'https://dist.apache.org/repos/dist/dev/corevance',
                directory: "${System.getProperty("java.io.tmpdir")}/corevance-dist-dev"
            ],
        ],
        step9: [
            order: 9,
            description: 'Verify distribution in staging environment',
        ],
        step10: [
            order: 10,
            description: 'Start voting on the dev mailing list',
        ],
        step11: [
            order: 11,
            description: 'Conclude the vote and announce results',
        ],
        step12: [
            order: 12,
            description: 'Upload distribution artifacts to release environment',
            subversion: [
                url: 'https://dist.apache.org/repos/dist/release/corevance',
                directory: "${System.getProperty("java.io.tmpdir")}/corevance-dist-release"
            ],
        ],
        step13: [
            order: 13,
            description: 'Close release branch and merge to \'develop\'',
        ],
        step14: [
            order: 14,
            description: 'Update website (not yet automated)',
        ],
        step15: [
            order: 15,
            description: 'Send email to announcement mailing list',
            jira: [
                projectId: "12319420",
                query: "project in (\'COREVANCE\') and fixVersion = ${findProperty('corevance.release.version')} and status in (CLOSED, RESOLVED, WONTFIX)"
            ],
            email: [
                from: "${findProperty('corevance.config.email')}",
                name: "${findProperty('corevance.config.name')}",
                to: "${findProperty('corevance.config.email')}",
                // to: 'dev@corevance.apache.org',
                mime: 'text/plain',
                subjectTemplate: [
                    templateFile: "${projectDir}/buildSrc/src/main/resources/email/release.step15.announce.subject.ftl"
                ],
                messageTemplate: [
                    templateFile: "${projectDir}/buildSrc/src/main/resources/email/release.step15.announce.message.ftl"
                ]
            ]
        ]
    ]
}
