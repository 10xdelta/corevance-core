corevance.sql-validation.profiles[0].patternRefs[2].order=2
corevance.sql-validation.profiles[0].patternRefs[3].name=detect-backend
corevance.sql-validation.profiles[0].patternRefs[3].order=3
corevance.sql-validation.profiles[0].patternRefs[4].name=detect-column
corevance.sql-validation.profiles[0].patternRefs[4].order=4
corevance.sql-validation.profiles[0].patternRefs[5].name=detect-out-of-bands
corevance.sql-validation.profiles[0].patternRefs[5].order=5
corevance.sql-validation.profiles[0].patternRefs[6].name=inject-stacked-query
