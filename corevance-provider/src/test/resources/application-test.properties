# sql validation

# inject-blind
corevance.sql-validation.patterns[0].name=inject-blind
corevance.sql-validation.patterns[0].pattern=(?i).*[\\"'`]?\\s*[and|or]+\\s*[\\"'`]?([\\d\\w])+[\\"'`]?\\s*=\\s*[\\"'`]?(\\1)[\\"'`]?\\s*.*

# detect-entry-point
corevance.sql-validation.patterns[1].name=detect-entry-point
corevance.sql-validation.patterns[1].pattern=(?i)^[\\"'`]?[\\)\\s]+

# inject-timing
corevance.sql-validation.patterns[2].name=inject-timing
corevance.sql-validation.patterns[2].pattern=(?i).*[\\"'`]?\\s*[and|\\+|&|\\|]+.*\\s*[sleep|pg_sleep|benchmark]+\\s*(\\(\\s*\\d+\\s*[,]?\\s*.*\\s*\\))+.*

# detect-backend
corevance.sql-validation.patterns[3].name=detect-backend
corevance.sql-validation.patterns[3].pattern=(?i).*\\[\\s*\\"(\\w+\\(.*\\))=(\\1)\\"\\s*,\\s*\\"\\w+\\"\\s*\\].*

# detect-column
corevance.sql-validation.patterns[4].name=detect-column
corevance.sql-validation.patterns[4].pattern=(?i).*[\\"'`]?\\s*(order\\s*by|group\\s*by|union\\s*select)+\\s+([\\d+|null]?\\s*,*\\s*)+\\s*.*

# detect-out-of-bands
corevance.sql-validation.patterns[5].name=detect-out-of-bands
corevance.sql-validation.patterns[5].pattern=(?i).*(select)+\\s+(load_file)+.*

# inject-stacked-query
corevance.sql-validation.patterns[6].name=inject-stacked-query
corevance.sql-validation.patterns[6].pattern=(?i).*[;]+\\s*(create|drop|alter|truncate|comment|select|insert|update|delete|merge|upsert|call|exec)+.*(from|into|set|table|column|database)*.*

# inject-comment
corevance.sql-validation.patterns[7].name=inject-comment
corevance.sql-validation.patterns[7].pattern=(?i).*\\s+(--|/\\*|#|\\(\\{)++.*

# main
corevance.sql-validation.profiles[0].name=main
corevance.sql-validation.profiles[0].description=Main Query Validation Profile
corevance.sql-validation.profiles[0].patternRefs[0].name=inject-blind
corevance.sql-validation.profiles[0].patternRefs[0].order=0
