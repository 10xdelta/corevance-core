# FOR TESTING PURPOSES ONLY! NOT SUITABLE FOR PRODUCTION USAGE!
version: "3.8"

services:
  db:
    extends:
      file: ./config/docker/compose/postgresql.yml
      service: postgresql

  corevance-manager:
    extends:
      file: ./config/docker/compose/corevance.yml
      service: corevance
    ports:
      - "8443:8443"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./config/docker/env/corevance-manager.env
      - ./config/docker/env/corevance-common.env
      - ./config/docker/env/corevance-postgresql.env
      - ./config/docker/env/aws.env
      - ./config/docker/env/kafka-client-msk.env

  corevance-worker:
    extends:
      file: ./config/docker/compose/corevance.yml
      service: corevance
    deploy:
      mode: replicated
      replicas: 2
    ports:
      - "8444-8445:8443"
    depends_on:
      corevance-manager:
        condition: service_healthy
    env_file:
      - ./config/docker/env/corevance-worker.env
      - ./config/docker/env/corevance-common.env
      - ./config/docker/env/corevance-postgresql.env
      - ./config/docker/env/aws.env
      - ./config/docker/env/kafka-client-msk.env
# FOR TESTING PURPOSES ONLY! NOT SUITABLE FOR PRODUCTION USAGE!
