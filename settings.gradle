plugins {
    id 'com.gradle.develocity' version '3.18.2'
    id 'com.gradle.common-custom-user-data-gradle-plugin' version '2.6.0'
}

def isCI = System.getenv('JENKINS_URL') != null

develocity {
    projectId = "corevance"
    server = "https://develocity.apache.org"
    buildScan {
        uploadInBackground = !isCI
        publishing.onlyIf { it.authenticated }
        obfuscation {
            ipAddresses { addresses ->
                addresses.collect { address ->
                    "0.0.0.0"
                }
            }
        }
    }
}

buildCache {
    local {
        enabled = true
    }
}

rootProject.name='corevance'
include ':corevance-core'
include ':corevance-security'
include ':corevance-cob'
include ':corevance-validation'
include ':corevance-command'
include ':corevance-command-test'
include ':corevance-command-jdbc'
include ':corevance-command-audit'
include ':corevance-command-async'
include ':corevance-command-disruptor'
include ':corevance-accounting'
include ':corevance-provider'
include ':corevance-branch'
include ':corevance-document'
include ':corevance-investor'
include ':corevance-rates'
include ':corevance-charge'
include ':corevance-tax'
include ':corevance-loan-origination'
include ':corevance-loan'
include ':corevance-savings'
include ':corevance-report'
include ':corevance-mix'
include ':corevance-war'
include ':integration-tests'
include ':twofactor-tests'
include ':oauth2-tests'
include ':corevance-client'
include ':corevance-client-feign'
include ':corevance-doc'
include ':corevance-avro-schemas'
include ':corevance-e2e-tests-core'
include ':corevance-e2e-tests-runner'
include 'corevance-progressive-loan'
include 'corevance-progressive-loan-embeddable-schedule-generator'
include 'corevance-working-capital-loan'
// NOTE: custom Docker image with all custom modules included
include ':custom:docker'
// NOTE: dynamically load custom modules with pattern "custom -> company -> category -> module"
file("${rootDir}/custom").eachDir { companyDir ->
    if('build' != companyDir.name && 'docker' != companyDir.name) {
        file("${rootDir}/custom/${companyDir.name}").eachDir { categoryDir ->
            if('build' != categoryDir.name) {
                file("${rootDir}/custom/${companyDir.name}/${categoryDir.name}").eachDir { moduleDir ->
                    if('build' != moduleDir.name && file("${moduleDir}/build.gradle").exists()) {
                        include ":custom:${companyDir.name}:${categoryDir.name}:${moduleDir.name}"
                    }
                }
            }
        }
    }
}
